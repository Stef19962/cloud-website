name: Deploy to easyname

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write server-side secrets config (not committed to git)
        run: |
          cat > anfrage-config.php << 'PHPEOF'
          <?php
          define('NOTION_TOKEN', '${{ secrets.NOTION_ANFRAGEN_TOKEN }}');
          define('NOTION_DATABASE_ID', '3fafbad5-a3be-41d5-ab71-7779ddf32af3');
          define('NOTION_REVIEWS_DATABASE_ID', 'bda00fc8-50e4-4e69-b798-567691b1cd8b');
          PHPEOF

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/README.md
